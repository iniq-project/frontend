<!DOCTYPE html>
<html lang="pt"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evento — INIQ</title>
<meta name="description" content="Detalhe de evento do Instituto Nacional das Infra-Estruturas da Qualidade (INIQ).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="normas.css">
<link rel="stylesheet" href="eventos.css">
<link rel="stylesheet" href="shell.css"></head>
<body class="shell-page" data-active="eventos" data-eyebrow="Agenda" data-title="Evento" data-intro="Detalhe do evento, programa e inscrição.">





<section class="evd-hero" id="evDetail" data-screen-label="Evento — Detalhe">
  <div class="evd-hero__bg" aria-hidden="true"><img id="evBg" src="assets/cover-qualidade.jpg" alt=""></div>
  <div class="container">
    <nav class="breadcrumb" aria-label="Trilho">
      <a href="index.html">Início</a>
      <span class="sep">/</span>
      <a href="eventos.html">Eventos</a>
      <span class="sep">/</span>
      <span class="cur" id="evBreadcrumb">Evento</span>
    </nav>
    <span class="evd-hero__type" id="evType">Tipo</span>
    <h1 id="evTitle">Título do evento</h1>
    <div class="evd-meta">
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 3v4M16 3v4"></path></svg>
        <div><div class="k">Data</div><div class="v" id="evDateMeta">—</div></div>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
        <div><div class="k">Horário</div><div class="v" id="evTimeMeta">—</div></div>
      </div>
      <div class="item">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        <div><div class="k">Local</div><div class="v" id="evLocMeta">—</div></div>
      </div>
    </div>
  </div>
</section>

<main class="section">
  <div class="container">
    <div class="evd-grid">
      <div>
        <div class="evd-body" id="evBody"></div>
        <div class="evd-prog" id="evPrograma"></div>
        <div style="margin-top:36px;">
          <a href="eventos.html" class="back-link">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"></path></svg>
            Voltar a todos os eventos
          </a>
        </div>
      </div>

      <aside class="evd-card">
        <div class="evd-card__top">
          <div class="evd-card__price" id="evCardPrice">—</div>
        </div>
        <div class="evd-card__body">
          <div class="evd-card__line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 9h18M8 3v4M16 3v4"></path></svg>
            <span><b id="evCardDate">—</b></span>
          </div>
          <div class="evd-card__line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <span><b id="evCardTime">—</b></span>
          </div>
          <div class="evd-card__line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path><circle cx="12" cy="10" r="3"></circle></svg>
            <span><b id="evCardLoc">—</b><span id="evCardCity" style="color:var(--slate-500);font-size:13px;"></span></span>
          </div>
        </div>
        <div class="evd-card__cta" id="evCardCta"></div>
      </aside>
    </div>
  </div>
</main>





<script src="script.js"></script>
<script src="cms-store.js"></script>
<script src="eventos.js"></script>


<script src="shell.js"></script></body></html>
